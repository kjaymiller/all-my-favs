name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check app alembic tests
      - name: tests
        run: uv run pytest
      - name: smoke
        env:
          AMF_API_KEY: ci-test-key-1234567890ab
          AMF_DATABASE_URL: "sqlite:///:memory:"
        run: uv run python -c "from app.main import app; print(f'ok {len(app.routes)} routes')"
