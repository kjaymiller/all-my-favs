services:
  app:
    build: .
    restart: unless-stopped
    environment:
      AMF_API_KEY: "${AMF_API_KEY:?AMF_API_KEY must be set - run op run --env-file=.env.op -- docker compose up}"
      AMF_DATABASE_URL: "${AMF_DATABASE_URL:?AMF_DATABASE_URL must be set - point at an external Postgres (see docker-compose.dev.yml for local)}"
      AMF_COOKIE_SECURE: ${AMF_COOKIE_SECURE:-false}
    ports:
      - "${AMF_PORT:-8787}:8000"
