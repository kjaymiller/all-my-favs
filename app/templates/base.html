<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}all-my-favs{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">all-my-favs</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/bookmarks">Bookmarks</a>
      <a href="https://wytchr.kjaymiller.dev" target="_blank" rel="noopener" class="external">wytchr ↗</a>
    </nav>
    <form method="post" action="/logout" class="logout">
      <button type="submit" class="ghost">Sign out</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="sitefoot">
    <span class="brand">all-my-favs</span>
    <span class="muted">v{{ app_version }}</span>
    <span class="sep">·</span>
    <a href="{{ source_url }}" target="_blank" rel="noopener">Source ↗</a>
    <span class="sep">·</span>
    <a href="/docs" target="_blank" rel="noopener">API docs</a>
    <span class="sep">·</span>
    <a href="/healthz" target="_blank" rel="noopener">Health</a>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
