<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header><strong>all-my-favs</strong></header>
  <form id="save">
    <label>URL <input id="url" type="url" required /></label>
    <label>Title <input id="title" type="text" /></label>
    <label>Tags <input id="tags" type="text" placeholder="tech:python, reading:longform" /></label>
    <label>Notes <textarea id="notes" rows="2"></textarea></label>
    <div class="row">
      <button type="submit" id="submit">Save</button>
      <a href="#" id="open-options">Settings</a>
    </div>
    <p id="status" class="status" hidden></p>
  </form>
  <script src="popup.js"></script>
</body>
</html>
