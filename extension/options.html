<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>all-my-favs — settings</title>
</head>
<body>
  <header><strong>all-my-favs</strong> — settings</header>
  <form id="opts">
    <label>Base URL <input id="baseUrl" type="url" placeholder="https://favs.example.com" required /></label>
    <label>API key <input id="apiKey" type="password" required /></label>
    <div class="row">
      <button type="submit">Save</button>
      <span id="status" class="status" hidden></span>
    </div>
  </form>
  <script src="options.js"></script>
</body>
</html>
